# ArkCRM - frontend on Render
# ---------------------------------------------------------------------------
# A static site: Vite builds to dist/, Render serves the files. Nothing runs
# on the server, so this is the cheap half of the deployment.
#
# The backend's address is written out rather than guessed: Render appends a
# suffix to a service name that is already taken, so the real hostname is the
# one below.
#
# VITE_USE_MOCKS must be "false". Left unset it defaults to true, and the
# site would serve in-browser fixtures and never call the API at all.
services:
  - type: web
    name: nexcrm-frontend
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_USE_MOCKS
        value: "false"
      # The deployed backend's address.
      - key: VITE_API_BASE_URL
        value: https://nexcrm-backend-zrbq.onrender.com/api/v1
      # The same host, over websockets.
      - key: VITE_SOCKET_URL
        value: wss://nexcrm-backend-zrbq.onrender.com/ws
    # A client-side router needs every path to serve index.html, or a
    # refresh on /vendor/VND-0001/dashboard is a 404.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
